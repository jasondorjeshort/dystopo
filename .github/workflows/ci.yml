# Continuous integration (T48). One lean Ubuntu job: Gradle check (JVM tests, goldens, license check,
# Android unit tests and lint), a tiny Rainier pack built from the network, the world tour cache-only
# (--offline-ok: areas whose data the job did not download are skipped), and the browser demo checked
# headlessly in pack mode. Artifacts: tour contact sheet, demo screenshots, Gradle reports.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Same-repo PRs are already covered by the push run on their branch (its status shows on the PR);
    # run pull_request events only for forks, so a PR does not cost two runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DYSTOPO_CACHE: ${{ github.workspace }}/cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # No font setup: the renderer draws labels with the Noto Sans TTFs bundled in serverlib (T50), so the
      # goldens match here without Arial or a fontconfig mapping.
      - name: Golden images first (fail fast)
        run: |
          chmod +x gradlew
          ./gradlew :devtool:test --tests '*GoldenImageTest*'

      - name: Gradle check
        # gradlew is committed without the executable bit (the repo is developed on Windows).
        run: |
          chmod +x gradlew
          ./gradlew check --continue

      - name: Install devtool
        run: ./gradlew :devtool:installDist

      - name: Build a tiny Rainier pack (DEM z8-10 from 3DEP/Copernicus, OSM from OpenFreeMap)
        timeout-minutes: 8
        run: bash tools/ci/demo-pack.sh 10

      - name: World tour z9, cache only
        run: |
          mkdir -p out/tour
          set +e
          devtool/build/install/devtool/bin/devtool tour --zooms 9 --offline-ok > out/tour/stdout.json
          STATUS=$?
          python3 -c 'import json; d = json.load(open("out/tour/summary.json")); print({k: d[k] for k in ("renders", "passed", "failed", "skipped", "totalMs")})' || cat out/tour/stdout.json
          exit $STATUS

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser demo check (pack mode, two views)
        run: |
          mkdir -p out/ci-demo
          python -I tools/demo-server.py 8765 > out/ci-demo/server.log 2>&1 &
          SERVER=$!
          sleep 2
          set +e
          python -I tools/demo-check.py --channel "" --url "http://localhost:8765/tools/demo/?osm=openmaptiles" \
            --views "9/46.85/-121.76:z9" "11/46.853/-121.76:z11" --out out/ci-demo/demo.png > out/ci-demo/report.json
          STATUS=$?
          kill $SERVER
          cat out/ci-demo/report.json
          exit $STATUS

      - name: Upload tour, demo screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results
          retention-days: 14
          if-no-files-found: ignore
          path: |
            out/tour/
            out/ci-demo/
            out/ci-*.json
            out/ci-serve.log
            build/reports/
            */build/reports/
            devtool/build/golden-diffs/

  image:
    # T58: the server image (server/Dockerfile: a Gradle build stage, then the JRE with the server and
    # tilebuild). Built and started here because the development machine has no Docker. T66: an outdoors
    # pack is built inside the container from a Geofabrik extract the server downloads on demand
    # (extractDownloads), with Planetiler's aux data (about 1.45 GB) in an Actions cache between runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -f server/Dockerfile -t dystopo-server .

      # The container's cache volume is a host directory, so the aux data can be cached by Actions. The
      # key names the aux set; bump it to refresh the files (they change rarely; tilebuild re-downloads
      # anything missing).
      - name: Restore Planetiler's aux data
        uses: actions/cache@v4
        with:
          path: |
            ci-cache/planetiler/*.zip
            ci-cache/planetiler/*.index
          key: planetiler-aux-v1

      - name: Run it; check /healthz, the token, /catalog and tilebuild
        run: |
          mkdir -p ci-cache/planetiler ci-out
          chmod -R a+rwX ci-cache ci-out
          cat > /tmp/server.json <<'JSON'
          {"extractDownloads": {"urls": ["https://download.geofabrik.de/europe/liechtenstein"], "maxMb": 64}}
          JSON
          chmod a+r /tmp/server.json
          docker run -d --name dystopo -p 8080:8080 -e DYSTOPO_SERVER_TOKEN=ci-token \
            -v "$PWD/ci-cache:/data/cache" -v "$PWD/ci-out:/data/out" \
            -v /tmp/server.json:/opt/dystopo/config/server.json:ro dystopo-server
          for i in $(seq 1 60); do curl -fsS localhost:8080/healthz > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/healthz | tee /tmp/healthz.json; echo
          curl -fsS localhost:8080/catalog | tee /tmp/catalog.json; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 'localhost:8080/build?name=x&bbox=1,1,1.01,1.01')" = 401
          curl -fsS -H 'Authorization: Bearer ci-token' localhost:8080/build | tee /tmp/build.json; echo
          python3 - <<'PY'
          import json
          h = json.load(open("/tmp/healthz.json"))
          assert h["status"] == "ok" and h["outDirWritable"] and h["cacheDirWritable"], h
          assert "catalog" in h, h
          c = json.load(open("/tmp/catalog.json"))
          assert c["packs"] == [], c
          limits = json.load(open("/tmp/build.json"))["limits"]
          t = limits["tilebuild"]
          assert t["available"], t
          regions = limits["extractDownloads"]["regions"]
          assert [r["name"] for r in regions] == ["liechtenstein"], regions
          print("image ok: healthz", h["catalog"], "tilebuild", t["how"], "download regions", regions)
          PY
          docker exec dystopo /opt/tilebuild/bin/tilebuild --help > /dev/null
          ls -la ci-cache/planetiler

      - name: Outdoors pack inside the container (extract downloaded on demand)
        timeout-minutes: 25
        run: |
          AUTH='Authorization: Bearer ci-token'
          # A box over the Overpass cap that no extract covers is refused with 422 (T66).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -X POST 'localhost:8080/build?name=far&bbox=6.6,45.6,7.2,46.0&minZoom=8&maxZoom=9&profile=outdoors')" = 422
          curl -fsS -H "$AUTH" -X POST 'localhost:8080/build?name=ci-small&bbox=9.54,47.11,9.60,47.16&minZoom=8&maxZoom=10&profile=outdoors&source=extract' | tee /tmp/job.json; echo
          ID=$(python3 -c 'import json; print(json.load(open("/tmp/job.json"))["id"])')
          for i in $(seq 1 280); do
            curl -fsS -H "$AUTH" "localhost:8080/build/$ID" > /tmp/job.json
            STATUS=$(python3 -c 'import json; d = json.load(open("/tmp/job.json")); print(d["status"])')
            [ "$STATUS" = done ] || [ "$STATUS" = failed ] || [ "$STATUS" = cancelled ] && break
            [ $((i % 12)) = 0 ] && python3 -c 'import json; d = json.load(open("/tmp/job.json")); print(d["phase"], d["download"], d["detail"])'
            sleep 5
          done
          cat /tmp/job.json; echo
          curl -fsS localhost:8080/catalog > /tmp/catalog.json
          python3 - <<'PY'
          import json
          j = json.load(open("/tmp/job.json"))
          assert j["status"] == "done", j
          assert j["osmSource"] == "extract" and j["osmProfile"] == "outdoors", j
          assert j["download"]["name"] == "liechtenstein" and j["download"]["bytes"] > 1_000_000, j["download"]
          assert j["provenance"]["osmExtract"]["name"] == "liechtenstein", j["provenance"]
          packs = {p["id"]: p for p in json.load(open("/tmp/catalog.json"))["packs"]}
          assert packs["ci-small"]["profile"] == "outdoors", packs
          print("outdoors build ok:", j["timings"], j["download"])
          PY
          ls -la ci-cache/planetiler ci-cache/extracts

      - name: Stop it (SIGTERM, graceful shutdown)
        if: always()
        run: |
          docker stop -t 15 dystopo || true
          docker logs dystopo 2>&1 | tail -5
          # The cache step saves ci-cache/planetiler after the job; the files are world-readable.
          sudo chmod -R a+rX ci-cache || true
