<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI (T48): Java's logical SansSerif resolves through fontconfig on Linux. The golden images were approved on
     Windows, where it is Arial; label placement depends on text widths and the label pixels on glyph shapes. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>sans</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>SansSerif</family><prefer><family>Arial</family></prefer></alias>
</fontconfig>
