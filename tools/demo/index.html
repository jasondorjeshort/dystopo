<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dystopo Demo</title>
<!--
  Interactive viewer for local tile output. Generate the data first (from the repo root):
    ./gradlew :devtool:run --args="tiles --bbox -122.05,46.60,-121.40,47.10 --min-zoom 8 --max-zoom 14 --pmtiles out/rainier-dem.pmtiles"
    ./gradlew :tilebuild:run --args="--extract north-america/us/washington --bbox -122.05,46.60,-121.40,47.10 --profile outdoors --out out/rainier-outdoors.pmtiles"
    ./gradlew :tilebuild:run --args="--extract north-america/us/washington --bbox -122.05,46.60,-121.40,47.10 --out out/rainier-osm.pmtiles"   (optional: OpenMapTiles profile)
  The page uses the outdoors archive when present (outdoor_poi markers, cliffs, named ridges, trails styled by
  sac_scale); ?osm=openmaptiles (or the panel select) switches to the OpenMapTiles archive.
  then serve the repo root with Range support and open this page:
    python -I tools/demo-server.py 8765   ->   http://localhost:8765/tools/demo/
  Hillshade and contours are computed in the browser from our Terrarium DEM region pack (a PMTiles archive read
  with range requests; MapLibre + pmtiles.js + maplibre-contour); trails, water and names come from our OSM PMTiles
  archive. The older XYZ directory still works: add --out out/rainier-best to the tiles command and open the page
  with ?dem=xyz. Only public test areas are referenced here.

  Live world mode: ./gradlew :devtool:run --args="serve --live --port 8687" and open http://localhost:8687/ (serve injects
  window.DYSTOPO_LIVE; ?live=1 does the same from any page served by it). Hillshade, contours and OSM then come from the
  serve routes: packs in out/ where they have the tile, else DEM rendered on request from the cloud sources (best: 3DEP,
  Copernicus, EGM2008) and OpenFreeMap base tiles, both cached on disk. The bottom box says which source the visible
  tiles came from (pack, live-3dep, live-swissalti, live-copernicus, openfreemap); "Build pack here" asks the server (POST /build) to make out/<name>-dem.pmtiles and
  out/<name>-outdoors.pmtiles (OpenFreeMap tiles, OpenMapTiles schema) for the current view and shows progress.

  Map options (T50; the phone's T47 options, same keys as devtool serve's /style.json): the "Map options" section of the
  panel, or the query string: hillshade=off|single|multi, hillshadeIntensity=0..1, slope=on (slope-angle bands; served
  by devtool serve as /shade/ tiles, so live mode only), contourInterval=auto|<n> in the shown units, night=on, and
  trails|water|landcover|pois|boundaries=off. Changes apply at once and are written back to the URL;
  window.dystopoOptions has the current set.

  Trip editor (T68, live mode only): tools/demo/trips.js adds "Plan a trip" to the panel (click start and end, drag
  numbered via points, right-click to remove, a summary card with the profile, GPX, Save as trip into this browser's
  sync replica and on to the server's sync peer); see the top of trips.js. T92: tools/demo/trip-sync.js adds the pull side
  ("Get trips from the server") and waypoint editing for the open trip; see the top of trip-sync.js.
-->
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
<style>
  :root { --paper: #f6f1e4; --ink: #2b2420; --panel: rgba(255, 252, 245, 0.92); }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; background: var(--panel); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 260px; }
  #panel summary { font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 4px; }
  #panel label { display: block; margin: 4px 0; }
  #panel label[hidden] { display: none; }
  #panel .hint { color: #6b5f55; font-size: 12px; margin-top: 6px; }
  @media (max-width: 520px) { #panel { max-width: 200px; padding: 6px 8px; } #panel .hint { display: none; } }
  @media (max-width: 520px) { #sources { top: auto; right: auto; bottom: 56px; left: 12px; } }
  #status { position: absolute; bottom: 30px; left: 12px; background: var(--panel); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  #sources { position: absolute; top: 12px; right: 52px; background: var(--panel); border-radius: 6px; padding: 4px 8px; font-size: 12px; max-width: calc(100% - 40px); }
  #options { margin: 6px 0; } #options summary { font-size: 13px; font-weight: 600; margin: 0; }
  #options .row { display: flex; flex-wrap: wrap; gap: 0 10px; } #options .row label { margin: 2px 0; }
  #buildcmd { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #fffaf0; border: 1px solid #e0d6c4; padding: 4px; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div id="map"></div>
<details id="panel" open>
  <summary>Dystopo: Mount Rainier</summary>
  <label><input type="checkbox" id="hill" checked> Hillshade (from our DEM tiles)</label>
  <label><input type="checkbox" id="contours" checked> Contours, <span id="contour-units">feet</span> (computed live)</label>
  <label id="units-row">Units <select id="unitsel"><option value="ft">feet</option><option value="m">metres</option><option value="">reset to the region default</option></select></label>
  <label><input type="checkbox" id="osm" checked> Trails, roads, water, names (OSM)</label>
  <label>OSM archive <select id="osmsel"><option value="outdoors">outdoors profile</option><option value="openmaptiles">OpenMapTiles profile</option></select></label>
  <label>Text size <input type="range" id="text" min="0.8" max="2" step="0.1" value="1.3"></label>
  <details id="options">
    <summary>Map options</summary>
    <label>Hillshade <select id="opt-hillshade"><option value="single">single light</option><option value="multi">multidirectional</option><option value="off">off</option></select></label>
    <label id="opt-slope-row"><input type="checkbox" id="opt-slope"> Slope-angle bands</label>
    <label>Contour interval <select id="opt-interval"><option value="auto">auto</option></select></label>
    <label><input type="checkbox" id="opt-night"> Night</label>
    <div class="row">
      <label><input type="checkbox" id="opt-trails" checked> trails</label>
      <label><input type="checkbox" id="opt-water" checked> water</label>
      <label><input type="checkbox" id="opt-landcover" checked> land cover</label>
      <label><input type="checkbox" id="opt-pois" checked> POIs</label>
      <label><input type="checkbox" id="opt-boundaries" checked> boundaries</label>
    </div>
  </details>
  <div class="hint" id="hint">Scroll to zoom, drag to pan. Demo data covers Rainier NP and surroundings at z8–14; the blank beyond is simply ungenerated. <span id="dem-mode"></span></div>
  <div id="live-tools" hidden>
    <label>Pack name <input id="packname" size="14" placeholder="from the view"></label>
    <label>Zooms <input id="packmin" type="number" min="0" max="15" value="8" style="width:3.2em"> to <input id="packmax" type="number" min="6" max="15" value="13" style="width:3.2em"></label>
    <label>Vector <select id="packprofile"><option value="outdoors">outdoors profile (tilebuild)</option><option value="openmaptiles">OpenMapTiles (OpenFreeMap tiles)</option></select></label>
    <label>OSM from <select id="packsource"><option value="auto">auto: a server extract, else Overpass</option><option value="extract">an extract on the server</option><option value="overpass">Overpass (small boxes)</option></select></label>
    <button id="packsources" type="button">What would it use?</button>
    <label><input type="checkbox" id="packreplace"> replace a pack of that name</label>
    <label title="The server's bearer token, when it has one (kept in this browser only)">Token <input id="packtoken" type="password" size="12" autocomplete="off" placeholder="none"></label>
    <button id="buildpack" type="button">Build pack here</button> <button id="buildcancel" type="button" hidden>Cancel</button>
    <pre id="buildcmd" hidden></pre>
  </div>
</details>
<div id="sources" hidden></div>
<div id="status"></div>
<script type="module">
const base = location.origin;
// Live world mode (devtool serve --live): serve injects window.DYSTOPO_LIVE; ?live=1 asks the server for the same.
const LIVE = window.DYSTOPO_LIVE || (new URLSearchParams(location.search).get("live") === "1" ? await (await fetch(base + "/live/info")).json() : null);
const phone = matchMedia("(max-width: 520px)");
const collapseOnPhone = () => { document.getElementById("panel").open = !phone.matches; }; // phone: layer panel collapsed
collapseOnPhone(); phone.onchange = collapseOnPhone;
// OSM archive: ?osm=outdoors (our outdoors profile; default when out/rainier-outdoors.pmtiles exists) or
// ?osm=openmaptiles (out/rainier-osm.pmtiles).
const osmParam = new URLSearchParams(location.search).get("osm");
let osmMode = osmParam === "openmaptiles" ? "openmaptiles" : "outdoors";
if (!LIVE && osmMode === "outdoors" && osmParam !== "outdoors") {
  try { if (!(await fetch(base + "/out/rainier-outdoors.pmtiles", { method: "HEAD" })).ok) osmMode = "openmaptiles"; } catch (e) { osmMode = "openmaptiles"; }
}
const osmArchiveUrl = base + (osmMode === "outdoors" ? "/out/rainier-outdoors.pmtiles" : "/out/rainier-osm.pmtiles");
// Units (docs/PLANNING.md > Units): a preference kept in localStorage (dystopo.units), seeded once by region while unset:
// live mode asks the server for the default where the page opens (GET /live/units: feet in the US, metres elsewhere,
// shared UnitRegions); pack mode shows the demo pack, Mount Rainier, which is in the US, so feet. After that only the
// user changes it (the Units select); panning, or opening the page somewhere else, keeps it. ?units=ft|m overrides it for
// one load without storing it (links, tools). Contour lines and labels, peak elevations and the scale bar follow it.
// window.dystopoUnits says which units are shown and where they came from (url, preference, region, pack).
const UNITS_KEY = "dystopo.units";
const readUnits = () => { try { const v = localStorage.getItem(UNITS_KEY); return v === "ft" || v === "m" ? v : null; } catch (e) { return null; } };
const writeUnits = v => { try { if (v) localStorage.setItem(UNITS_KEY, v); else localStorage.removeItem(UNITS_KEY); } catch (e) { /* private mode: this load only */ } };
let UNITS = "ft", unitsSource = "pack";
{
  const unitsParam = new URLSearchParams(location.search).get("units");
  if (unitsParam === "ft" || unitsParam === "m") { UNITS = unitsParam; unitsSource = "url"; }
  else if (readUnits()) { UNITS = readUnits(); unitsSource = "preference"; }
  else {
    if (LIVE) {
      const h = location.hash.slice(1).split("/").map(Number);
      const [lat, lon] = h.length >= 3 && h.every(Number.isFinite) ? [h[1], h[2]] : [46.86, -121.76];
      try { UNITS = (await (await fetch(base + "/live/units?lat=" + lat + "&lon=" + lon)).json()).units; unitsSource = "region"; } catch (e) { /* keep feet */ }
    }
    writeUnits(UNITS);
  }
}
window.dystopoUnits = { units: UNITS, source: unitsSource, stored: readUnits() };
document.getElementById("contour-units").textContent = UNITS === "m" ? "metres" : "feet";
const ELE = UNITS === "m" ? ["round", ["to-number", ["get", "ele"], 0]] : ["round", ["*", ["to-number", ["get", "ele"], 0], 3.28084]];

let demSource = null, contourTiles = null, demArchive = null, contourUrl = null; // pack mode only (null in live mode)
if (!LIVE) {
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// DEM source: the PMTiles region pack (default), or the XYZ directory with ?dem=xyz.
const demMode = new URLSearchParams(location.search).get("dem") === "xyz" ? "xyz" : "pmtiles";
const demArchiveUrl = base + "/out/rainier-dem.pmtiles";
const demXyzUrl = base + "/out/rainier-best/{z}/{x}/{y}.png";
if (demMode === "pmtiles") {
  demArchive = new pmtiles.PMTiles(demArchiveUrl);
  protocol.add(demArchive); // one instance (header and directory cache) for hillshade and contours
}
document.getElementById("dem-mode").textContent = (demMode === "pmtiles" ? "DEM: out/rainier-dem.pmtiles. " : "DEM: XYZ directory out/rainier-best. ") + "OSM: " + osmArchiveUrl.replace(base + "/", "") + ".";

// Contours are generated from the Terrarium tiles in the preferred units (multiplier and thresholds per unit).
// maplibre-contour fetches tiles with fetch() in a worker, which cannot read a PMTiles archive, so in
// pmtiles mode it runs on the main thread and gets its tiles from the archive through getTile.
demSource = new mlcontour.DemSource({
  url: demMode === "pmtiles" ? "pmtiles://" + demArchiveUrl + "/{z}/{x}/{y}" : demXyzUrl,
  encoding: "terrarium",
  maxzoom: 14,
  worker: false, // main thread: getTile below must be replaceable, and a worker cannot read the PMTiles archive
});
demSource.setupMaplibre(maplibregl);

// The z13-14 tiles exist only over the core box and z8-12 only over the region, but contours need all eight
// neighbours of a tile and hillshade needs the tile itself. Where a tile is missing (404), synthesize it from
// the nearest ancestor that exists: crop and bilinearly upsample the elevations, re-encode as Terrarium PNG.
// That gives overzoomed (soft) shading and contours past the z13 edge instead of a hard cut, and keeps the
// outermost tiles of the region from losing their contours. Outside every ancestor the tile stays missing.
const MIN_ANCESTOR_Z = 8;
async function fetchOk(url, abortController) {
  const r = await fetch(url, { signal: abortController.signal });
  return r.ok ? r : null;
}
async function decodeTerrarium(blob) {
  const bmp = await createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  const c = new OffscreenCanvas(bmp.width, bmp.height);
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  const px = g.getImageData(0, 0, bmp.width, bmp.height).data;
  const e = new Float32Array(bmp.width * bmp.height);
  for (let i = 0; i < e.length; i++) e[i] = px[4 * i] * 256 + px[4 * i + 1] + px[4 * i + 2] / 256 - 32768;
  return { w: bmp.width, h: bmp.height, e };
}
async function overzoomedTile(z, x, y, abortController) {
  for (let pz = Math.min(z - 1, 12); pz >= MIN_ANCESTOR_Z; pz--) {
    const d = z - pz, px = x >> d, py = y >> d;
    const r = await demBlob(pz, px, py, abortController);
    if (!r) continue;
    const t = await decodeTerrarium(r.data);
    const n = 1 << d, S = 256, sub = t.w / n; // source pixels per child tile edge
    const ox = (x - (px << d)) * sub, oy = (y - (py << d)) * sub;
    const out = new OffscreenCanvas(S, S), og = out.getContext("2d");
    const img = og.createImageData(S, S);
    for (let j = 0; j < S; j++) {
      const sy = Math.min(t.h - 1, Math.max(0, oy + (j + 0.5) * sub / S - 0.5)), y0 = Math.floor(sy), y1 = Math.min(t.h - 1, y0 + 1), fy = sy - y0;
      for (let i = 0; i < S; i++) {
        const sx = Math.min(t.w - 1, Math.max(0, ox + (i + 0.5) * sub / S - 0.5)), x0 = Math.floor(sx), x1 = Math.min(t.w - 1, x0 + 1), fx = sx - x0;
        const v = (t.e[y0 * t.w + x0] * (1 - fx) + t.e[y0 * t.w + x1] * fx) * (1 - fy) + (t.e[y1 * t.w + x0] * (1 - fx) + t.e[y1 * t.w + x1] * fx) * fy + 32768;
        const k = 4 * (j * S + i), iv = Math.floor(v);
        img.data[k] = iv >> 8; img.data[k + 1] = iv & 255; img.data[k + 2] = Math.floor((v - iv) * 256); img.data[k + 3] = 255;
      }
    }
    og.putImageData(img, 0, 0);
    return { data: await out.convertToBlob({ type: "image/png" }) };
  }
  return null;
}
// One tile from the DEM store: the PMTiles archive (default) or the XYZ directory (?dem=xyz). Null if absent.
async function demBlob(z, x, y, abortController) {
  if (demMode === "pmtiles") {
    const tile = await demArchive.getZxy(z, x, y, abortController.signal);
    return tile ? { data: new Blob([tile.data], { type: "image/png" }) } : null;
  }
  const r = await fetchOk(demXyzUrl.replace("{z}", z).replace("{x}", x).replace("{y}", y), abortController);
  return r ? { data: await r.blob(), expires: r.headers.get("expires") || undefined, cacheControl: r.headers.get("cache-control") || undefined } : null;
}
demSource.manager.getTile = async (url, abortController) => {
  const [z, x, y] = url.match(/(\d+)\/(\d+)\/(\d+)(?:\.png)?$/).slice(1).map(Number);
  const t = (await demBlob(z, x, y, abortController)) || (await overzoomedTile(z, x, y, abortController));
  if (t) return t;
  // Same wording as a missing XYZ tile, so the map's error filter treats both alike.
  throw new Error(`Bad response: 404 Not Found: DEM tile ${z}/${x}/${y}`);
};
// A contour tile also needs its 8 neighbours; a neighbour that is missing everywhere (the edge of the generated
// region) is treated as no data instead of failing the whole tile.
const fetchDem0 = demSource.manager.fetchDem.bind(demSource.manager);
demSource.manager.fetchDem = (...a) => fetchDem0(...a).catch(e => { if (/Bad response: 404/.test(e.message)) return undefined; throw e; });
contourUrl = interval => {
  const thresholds = UNITS === "m"
    ? { 8: [250, 1000], 10: [100, 500], 11: [50, 250], 12: [20, 100], 13: [20, 100], 14: [10, 50], 15: [5, 25] }
    : { 8: [1000, 5000], 10: [500, 2500], 11: [200, 1000], 12: [100, 500], 13: [80, 400], 14: [40, 200], 15: [20, 100] };
  // A fixed interval (map options) from contour zoom 11 up, index lines every fifth, as on the phone.
  if (interval) for (const z of [11, 12, 13, 14, 15]) thresholds[z] = [interval, interval * 5];
  return demSource.contourProtocolUrl({ multiplier: UNITS === "m" ? 1 : 3.28084, thresholds, elevationKey: "ele", levelKey: "level", contourLayer: "contours" });
};
contourTiles = contourUrl(null);
} // end pack mode
if (LIVE) document.getElementById("hint").textContent = "Scroll to zoom, drag to pan. " + "Live: packs in out/ first (" + (LIVE.demPacks.length + LIVE.osmPacks.length) + " open), else DEM from the cloud sources and OSM from OpenFreeMap.";

// Label names (as MapLibreStyle.LABEL_NAME): English, else Latin transliteration, else the local name; a local name in
// another script follows on a second line where MapLibre can shape that script (not Devanagari, for example).
const NAME = ["let", "primary", ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"], ""],
  ["case", ["all", ["has", "name:nonlatin"], ["!=", ["get", "name:nonlatin"], ["var", "primary"]], ["is-supported-script", ["get", "name:nonlatin"]]],
    ["concat", ["var", "primary"], "\n", ["get", "name:nonlatin"]], ["var", "primary"]]];

// Outdoors POI markers: the renderer's marker table (DefaultOsmStyle in shared/.../style, see its KDoc), same
// shapes, colours, relative sizes, first zoom and subclass exclusions. Keep the two in step (MarkerTableTest).
// The icons come from the sprite sheet devtool writes from that table (Sprites.kt; same icon names, see iconName):
// served at /sprite by devtool serve, and in pack mode read from out/sprite* when ./gradlew :devtool:run
// --args="sprite" has made it. Without a sheet, the same shapes are drawn into canvas icons on demand
// (styleimagemissing). MARKER_SCALE enlarges them for screen viewing like the text sizes here.
const MARKERS = {
  hut:            { shape: "house",    size: 9,   color: "#6b3a1a", minzoom: 12, rank: 1 },
  trailhead:      { shape: "square",   size: 7.5, color: "#b0281c", minzoom: 13, rank: 2 },
  campsite:       { shape: "triangle", size: 8,   color: "#2e7d32", minzoom: 13, rank: 3 },
  shelter:        { shape: "house",    size: 7.5, color: "#a0703c", minzoom: 13, rank: 4 },
  waterfall:      { shape: "diamond",  size: 7,   color: "#1f78c8", minzoom: 13, rank: 5 },
  viewpoint:      { shape: "star",     size: 8,   color: "#c25e00", minzoom: 14, rank: 6 },
  spring:         { shape: "circle",   size: 5.5, color: "#1f78c8", minzoom: 14, rank: 7 },
  drinking_water: { shape: "circle",   size: 5.5, color: "#1f78c8", minzoom: 14, rank: 7 },
  cave:           { shape: "circle",   size: 5.5, color: "#222222", minzoom: 14, rank: 8 },
  parking:        { shape: "square",   size: 8,   color: "#2b5fa8", minzoom: 14, rank: 9, text: "P" },
};
const MARKER_EXCLUDED_SUBCLASSES = ["camp_pitch", "picnic_shelter", "gazebo", "street_side"];
const MARKER_SCALE = 1.4, MARKER_RATIO = 2, MARKER_HALO = "#f6f1e4";
// Sprites.ICON_SCALE and Sprites.iconName: sheet icons are SPRITE_ICON_SCALE logical px per marker px.
const SPRITE_ICON_SCALE = 4;
const iconName = m => "marker-" + m.shape + "-" + m.color.slice(1) + "-" + m.size + (m.text ? "-" + m.text : "");
const markerByIcon = Object.fromEntries(Object.values(MARKERS).map(m => [iconName(m), m]));
// The sheet: live mode always (serve makes it); pack mode when out/sprite.png exists (a 404 there is harmless).
let spriteUrl = LIVE ? base + "/sprite" : null;
if (!LIVE) { try { if ((await fetch(base + "/out/sprite.png", { method: "HEAD" })).ok) spriteUrl = base + "/out/sprite"; } catch (e) { } }
// Outline of a marker of radius r centred at (cx, cy): the same vertices as OsmLayer.markerShape in devtool.
function markerPath(g, shape, cx, cy, r) {
  g.beginPath();
  const poly = pts => { pts.forEach(([x, y], i) => i ? g.lineTo(cx + x * r, cy + y * r) : g.moveTo(cx + x * r, cy + y * r)); g.closePath(); };
  if (shape === "circle") g.arc(cx, cy, r, 0, 2 * Math.PI);
  else if (shape === "square") g.rect(cx - r * 0.9, cy - r * 0.9, 1.8 * r, 1.8 * r);
  else if (shape === "triangle") poly([[0, -1.1], [1, 0.8], [-1, 0.8]]);
  else if (shape === "diamond") poly([[0, -1.15], [0.9, 0], [0, 1.15], [-0.9, 0]]);
  else if (shape === "house") poly([[0, -1.1], [1, -0.1], [0.75, -0.1], [0.75, 0.9], [-0.75, 0.9], [-0.75, -0.1], [-1, -0.1]]);
  else if (shape === "star") poly(Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.5 : 1.2; return [rr * Math.cos(a), rr * Math.sin(a)]; }));
}
// The canvas stand-in for a sheet icon: same logical size, halo and padding as Sprites.side / SpriteSheets.render.
function markerImage(m) {
  const k = SPRITE_ICON_SCALE * MARKER_RATIO, px = m.size * k, r = px / 2, halo = 2.5 * k;
  const side = Math.ceil(px * 1.3 + halo), c = side / 2;
  const canvas = new OffscreenCanvas(side, side), g = canvas.getContext("2d");
  markerPath(g, m.shape, c, c, r);
  g.lineJoin = "round"; g.lineWidth = halo; g.strokeStyle = MARKER_HALO; g.stroke();
  g.fillStyle = m.color; g.fill();
  if (m.text) {
    g.fillStyle = "#ffffff"; g.font = `bold ${Math.round(px * 0.8)}px system-ui, sans-serif`;

    const r = await (await fetch(base + "/live/sources?" + q)).json();
    const fmt = o => Object.entries(o).map(([k, v]) => k + " " + v).join(", ") || "none";
    srcBox.textContent = "DEM z" + r.demZoom + ": " + fmt(r.dem) + "  ·  OSM z" + r.osmZoom + ": " + fmt(r.osm);
    window.dystopoLive = r;
    if (r.attribution) creditView(r.attribution);
    return r;
  };
  map.on("idle", () => { window.dystopoLiveSources().catch(() => {}); });
  // Build pack here: POST /build on the server for the current view (DEM from the live sources, OSM from
  // Overpass + tilebuild's outdoors profile, or OpenFreeMap tiles with profile=openmaptiles), then poll GET /build/{id} for progress. The finished files are under /out/ and the server
  // serves the view from them at once (the source box then says pack). window.dystopoBuild has the last job.
  const pre = document.getElementById("buildcmd"), cancelBtn = document.getElementById("buildcancel");
  let buildTimer = null, buildId = null;
  // T58: the server's bearer token for /build. ?token= sets it (then leaves the address bar so it is not
  // bookmarked or shared), the Token field changes it, localStorage (dystopo.token) keeps it for this browser.
  const TOKEN_KEY = "dystopo.token", tokenInput = document.getElementById("packtoken");
  const readToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return tokenInput.value; } };
  const writeToken = v => { try { if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* private mode: the field only */ } };
  {
    const u = new URL(location.href), t = u.searchParams.get("token");
    if (t !== null) { writeToken(t.trim()); u.searchParams.delete("token"); history.replaceState(history.state, "", u); }
  }
  tokenInput.value = readToken();
  tokenInput.onchange = () => writeToken(tokenInput.value.trim());
  const authed = (opts = {}) => { const t = tokenInput.value.trim(); return t ? { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + t } } : opts; };
  window.dystopoToken = () => tokenInput.value.trim() ? "set" : "none";
  const show = text => { pre.textContent = text; pre.hidden = false; };
  const describe = j => {
    if (j.error && !j.id) return "refused: " + j.error;
    const part = (k, o) => o.zooms ? k + " z" + o.zooms[0] + "-" + o.zooms[1] + " " + o.done + "/" + o.total + " (" + o.cached + " cached, " + o.written + " written)" : k + " none";
    const lines = [j.name + " " + j.status + " " + j.percent + "%  " + (j.elapsedMs / 1000).toFixed(1) + " s", part("DEM", j.dem), part("OSM", j.osm)];
    const ex = j.provenance && j.provenance.osmExtract;
    const from = j.osmSource ? " from " + j.osmSource + (ex ? " " + ex.name + " (data of " + String(ex.date).slice(0, 10) + ")" : "") : "";
    if (j.osmProfile) lines.push("vector profile " + j.osmProfile + from + (j.status === "running" && j.phase ? ", phase " + j.phase : "") + (j.detail ? ": " + j.detail : ""));
    for (const w of j.warnings || []) lines.push("warning: " + w);
    if (j.status === "done") for (const f of j.files) lines.push(f.url + "  " + (f.bytes / 1048576).toFixed(1) + " MB, " + f.tiles + " tiles z" + f.minZoom + "-" + f.maxZoom);
    if (j.error) lines.push("error: " + j.error);
    return lines.join("\n");
  };
  const poll = async () => {
    const j = await (await fetch(base + "/build/" + buildId, authed())).json();
    window.dystopoBuild = j;
    show(describe(j));
    if (j.status === "queued" || j.status === "running") { buildTimer = setTimeout(poll, 1000); return; }
    cancelBtn.hidden = true;
    if (j.status === "done") window.dystopoLiveSources().catch(() => {});
  };
  const viewBbox = () => {
    const b = map.getBounds(), r3 = (v, up) => (up ? Math.ceil(v * 1000) : Math.floor(v * 1000)) / 1000;
    return [r3(Math.max(-180, b.getWest())), r3(Math.max(-85, b.getSouth())), r3(Math.min(180, b.getEast()), true), r3(Math.min(85, b.getNorth()), true)].join(",");
  };
  // T64: GET /build/sources says which OSM source an outdoors build of the view would use (extract, Overpass or the OpenFreeMap fallback).
  document.getElementById("packsources").onclick = async () => {
    const r = await (await fetch(base + "/build/sources?bbox=" + viewBbox(), authed())).json();
    window.dystopoBuildSources = r;
    if (r.error) { show("refused: " + r.error); return; }
    const o = r.outdoors, lines = ["outdoors build of this view (" + r.areaSqDeg.toFixed(3) + " sq deg): " + o.source + (o.extract ? " " + o.extract.name + " (data of " + String(o.extract.date).slice(0, 10) + ")" : "") + " -> " + o.profile];
    if (o.why) lines.push(o.why);
    for (const e of r.extracts) lines.push("extract " + e.name + " " + (e.bytes / 1048576).toFixed(0) + " MB, " + String(e.date).slice(0, 10) + (e.covers ? ", covers the view" : ", does not cover the view"));
    lines.push("Overpass: " + (r.overpass.underCap ? "under" : "over") + " its " + r.overpass.maxAreaSqDeg + " sq deg cap");
    show(lines.join("\n"));
  };
  document.getElementById("buildpack").onclick = async () => {
    const c = map.getCenter(), bbox = viewBbox();
    const auto = (c.lat >= 0 ? "n" : "s") + Math.abs(c.lat).toFixed(2) + (c.lng >= 0 ? "e" : "w") + Math.abs(c.lng).toFixed(2);
    const name = document.getElementById("packname").value.trim() || auto;
    const q = new URLSearchParams({ name, bbox, minZoom: document.getElementById("packmin").value, maxZoom: document.getElementById("packmax").value, profile: document.getElementById("packprofile").value, source: document.getElementById("packsource").value });
    if (document.getElementById("packreplace").checked) q.set("overwrite", "1");
    clearTimeout(buildTimer);
    const r = await fetch(base + "/build?" + q, authed({ method: "POST" }));
    const j = await r.json();
    window.dystopoBuild = j;
    if (r.status === 401) { show("refused: the server needs its token (Token field, or open the page with ?token=...)" + (j.error ? "\n" + j.error : "")); return; }
    if (!r.ok) { show(describe(j)); return; }
    buildId = j.id; cancelBtn.hidden = false;
    show(describe(j));
    buildTimer = setTimeout(poll, 500);
  };
  cancelBtn.onclick = async () => { if (buildId) await fetch(base + "/build/" + buildId, authed({ method: "DELETE" })); };
}
// T68: the trip editor (tools/demo/trips.js, served as /trips.js) plans on the server's /route routes, so live mode only.
// T92: a server with users keeps /route* behind its tokens, and trips.js sends the Token field only with its sync push,
// so the page adds it to this server's /route requests here (until trips.js sends it itself).
if (LIVE) {
  const pageFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    const t = document.getElementById("packtoken").value.trim();
    if (t && url.startsWith(base + "/route") && !(init && init.headers && init.headers.Authorization))
      init = { ...(init || {}), headers: { ...((init && init.headers) || {}), Authorization: "Bearer " + t } };
    return pageFetch(input, init);
  };
}
const tripToken = () => document.getElementById("packtoken").value.trim();
if (LIVE) import(base + "/trips.js").then(m => m.install({ map, base, units: UNITS, panel: document.getElementById("panel"), token: tripToken }))
  // T92: the pull side of the trip replica and waypoint editing (tools/demo/trip-sync.js), on top of the trip editor.
  .then(() => import(base + "/trip-sync.js")).then(m => m.install({ map, base, units: UNITS, panel: document.getElementById("panel"), token: tripToken }))
  .catch(e => console.warn("trip editor not loaded: " + e.message));
map.on("error", e => { if (e.error && !/404|Not Found/.test(e.error.message || "")) console.warn(e.error); });
</script>
