<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dystopo Demo</title>
<!--
  Interactive viewer for local tile output. Generate the data first (from the repo root):
    ./gradlew :devtool:run --args="tiles --bbox -122.05,46.60,-121.40,47.10 --min-zoom 8 --max-zoom 14 --pmtiles out/rainier-dem.pmtiles"
    ./gradlew :tilebuild:run --args="--extract north-america/us/washington --bbox -122.05,46.60,-121.40,47.10 --profile outdoors --out out/rainier-outdoors.pmtiles"
    ./gradlew :tilebuild:run --args="--extract north-america/us/washington --bbox -122.05,46.60,-121.40,47.10 --out out/rainier-osm.pmtiles"   (optional: OpenMapTiles profile)
  The page uses the outdoors archive when present (outdoor_poi markers, cliffs, named ridges, trails styled by
  sac_scale); ?osm=openmaptiles (or the panel select) switches to the OpenMapTiles archive.
  then serve the repo root with Range support and open this page:
    python -I tools/demo-server.py 8765   ->   http://localhost:8765/tools/demo/
  Hillshade and contours are computed in the browser from our Terrarium DEM region pack (a PMTiles archive read
  with range requests; MapLibre + pmtiles.js + maplibre-contour); trails, water and names come from our OSM PMTiles
  archive. The older XYZ directory still works: add --out out/rainier-best to the tiles command and open the page
  with ?dem=xyz. Only public test areas are referenced here.
-->
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
<style>
  :root { --paper: #f6f1e4; --ink: #2b2420; --panel: rgba(255, 252, 245, 0.92); }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; background: var(--panel); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 260px; }
  #panel summary { font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 4px; }
  #panel label { display: block; margin: 4px 0; }
  #panel .hint { color: #6b5f55; font-size: 12px; margin-top: 6px; }
  @media (max-width: 520px) { #panel { max-width: 200px; padding: 6px 8px; } #panel .hint { display: none; } }
  #status { position: absolute; bottom: 30px; left: 12px; background: var(--panel); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<details id="panel" open>
  <summary>Dystopo: Mount Rainier</summary>
  <label><input type="checkbox" id="hill" checked> Hillshade (from our DEM tiles)</label>
  <label><input type="checkbox" id="contours" checked> Contours, feet (computed live)</label>
  <label><input type="checkbox" id="osm" checked> Trails, roads, water, names (OSM)</label>
  <label>OSM archive <select id="osmsel"><option value="outdoors">outdoors profile</option><option value="openmaptiles">OpenMapTiles profile</option></select></label>
  <label>Text size <input type="range" id="text" min="0.8" max="2" step="0.1" value="1.3"></label>
  <div class="hint">Scroll to zoom, drag to pan. Demo data covers Rainier NP and surroundings at z8–14; the blank beyond is simply ungenerated. <span id="dem-mode"></span></div>
</details>
<div id="status"></div>
<script type="module">
const base = location.origin;
const phone = matchMedia("(max-width: 520px)");
const collapseOnPhone = () => { document.getElementById("panel").open = !phone.matches; }; // phone: layer panel collapsed
collapseOnPhone(); phone.onchange = collapseOnPhone;
// OSM archive: ?osm=outdoors (our outdoors profile; default when out/rainier-outdoors.pmtiles exists) or
// ?osm=openmaptiles (out/rainier-osm.pmtiles).
const osmParam = new URLSearchParams(location.search).get("osm");
let osmMode = osmParam === "openmaptiles" ? "openmaptiles" : "outdoors";
if (osmMode === "outdoors" && osmParam !== "outdoors") {
  try { if (!(await fetch(base + "/out/rainier-outdoors.pmtiles", { method: "HEAD" })).ok) osmMode = "openmaptiles"; } catch (e) { osmMode = "openmaptiles"; }
}
const osmArchiveUrl = base + (osmMode === "outdoors" ? "/out/rainier-outdoors.pmtiles" : "/out/rainier-osm.pmtiles");
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// DEM source: the PMTiles region pack (default), or the XYZ directory with ?dem=xyz.
const demMode = new URLSearchParams(location.search).get("dem") === "xyz" ? "xyz" : "pmtiles";
const demArchiveUrl = base + "/out/rainier-dem.pmtiles";
const demXyzUrl = base + "/out/rainier-best/{z}/{x}/{y}.png";
let demArchive = null;
if (demMode === "pmtiles") {
  demArchive = new pmtiles.PMTiles(demArchiveUrl);
  protocol.add(demArchive); // one instance (header and directory cache) for hillshade and contours
}
document.getElementById("dem-mode").textContent = (demMode === "pmtiles" ? "DEM: out/rainier-dem.pmtiles. " : "DEM: XYZ directory out/rainier-best. ") + "OSM: " + osmArchiveUrl.replace(base + "/", "") + ".";

// Contours are generated from the Terrarium tiles; thresholds are in feet (multiplier).
// maplibre-contour fetches tiles with fetch() in a worker, which cannot read a PMTiles archive, so in
// pmtiles mode it runs on the main thread and gets its tiles from the archive through getTile.
const demSource = new mlcontour.DemSource({
  url: demMode === "pmtiles" ? "pmtiles://" + demArchiveUrl + "/{z}/{x}/{y}" : demXyzUrl,
  encoding: "terrarium",
  maxzoom: 14,
  worker: false, // main thread: getTile below must be replaceable, and a worker cannot read the PMTiles archive
});
demSource.setupMaplibre(maplibregl);

// The z13-14 tiles exist only over the core box and z8-12 only over the region, but contours need all eight
// neighbours of a tile and hillshade needs the tile itself. Where a tile is missing (404), synthesize it from
// the nearest ancestor that exists: crop and bilinearly upsample the elevations, re-encode as Terrarium PNG.
// That gives overzoomed (soft) shading and contours past the z13 edge instead of a hard cut, and keeps the
// outermost tiles of the region from losing their contours. Outside every ancestor the tile stays missing.
const MIN_ANCESTOR_Z = 8;
async function fetchOk(url, abortController) {
  const r = await fetch(url, { signal: abortController.signal });
  return r.ok ? r : null;
}
async function decodeTerrarium(blob) {
  const bmp = await createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  const c = new OffscreenCanvas(bmp.width, bmp.height);
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  const px = g.getImageData(0, 0, bmp.width, bmp.height).data;
  const e = new Float32Array(bmp.width * bmp.height);
  for (let i = 0; i < e.length; i++) e[i] = px[4 * i] * 256 + px[4 * i + 1] + px[4 * i + 2] / 256 - 32768;
  return { w: bmp.width, h: bmp.height, e };
}
async function overzoomedTile(z, x, y, abortController) {
  for (let pz = Math.min(z - 1, 12); pz >= MIN_ANCESTOR_Z; pz--) {
    const d = z - pz, px = x >> d, py = y >> d;
    const r = await demBlob(pz, px, py, abortController);
    if (!r) continue;
    const t = await decodeTerrarium(r.data);
    const n = 1 << d, S = 256, sub = t.w / n; // source pixels per child tile edge
    const ox = (x - (px << d)) * sub, oy = (y - (py << d)) * sub;
    const out = new OffscreenCanvas(S, S), og = out.getContext("2d");
    const img = og.createImageData(S, S);
    for (let j = 0; j < S; j++) {
      const sy = Math.min(t.h - 1, Math.max(0, oy + (j + 0.5) * sub / S - 0.5)), y0 = Math.floor(sy), y1 = Math.min(t.h - 1, y0 + 1), fy = sy - y0;
      for (let i = 0; i < S; i++) {
        const sx = Math.min(t.w - 1, Math.max(0, ox + (i + 0.5) * sub / S - 0.5)), x0 = Math.floor(sx), x1 = Math.min(t.w - 1, x0 + 1), fx = sx - x0;
        const v = (t.e[y0 * t.w + x0] * (1 - fx) + t.e[y0 * t.w + x1] * fx) * (1 - fy) + (t.e[y1 * t.w + x0] * (1 - fx) + t.e[y1 * t.w + x1] * fx) * fy + 32768;
        const k = 4 * (j * S + i), iv = Math.floor(v);
        img.data[k] = iv >> 8; img.data[k + 1] = iv & 255; img.data[k + 2] = Math.floor((v - iv) * 256); img.data[k + 3] = 255;
      }
    }
    og.putImageData(img, 0, 0);
    return { data: await out.convertToBlob({ type: "image/png" }) };
  }
  return null;
}
// One tile from the DEM store: the PMTiles archive (default) or the XYZ directory (?dem=xyz). Null if absent.
async function demBlob(z, x, y, abortController) {
  if (demMode === "pmtiles") {
    const tile = await demArchive.getZxy(z, x, y, abortController.signal);
    return tile ? { data: new Blob([tile.data], { type: "image/png" }) } : null;
  }
  const r = await fetchOk(demXyzUrl.replace("{z}", z).replace("{x}", x).replace("{y}", y), abortController);
  return r ? { data: await r.blob(), expires: r.headers.get("expires") || undefined, cacheControl: r.headers.get("cache-control") || undefined } : null;
}
demSource.manager.getTile = async (url, abortController) => {
  const [z, x, y] = url.match(/(\d+)\/(\d+)\/(\d+)(?:\.png)?$/).slice(1).map(Number);
  const t = (await demBlob(z, x, y, abortController)) || (await overzoomedTile(z, x, y, abortController));
  if (t) return t;
  // Same wording as a missing XYZ tile, so the map's error filter treats both alike.
  throw new Error(`Bad response: 404 Not Found: DEM tile ${z}/${x}/${y}`);
};
// A contour tile also needs its 8 neighbours; a neighbour that is missing everywhere (the edge of the generated
// region) is treated as no data instead of failing the whole tile.
const fetchDem0 = demSource.manager.fetchDem.bind(demSource.manager);
demSource.manager.fetchDem = (...a) => fetchDem0(...a).catch(e => { if (/Bad response: 404/.test(e.message)) return undefined; throw e; });

// Outdoors POI markers: the renderer's marker table (DefaultOsmStyle in shared/.../style, see its KDoc), same
// shapes, colours, relative sizes, first zoom and subclass exclusions. Keep the two in step. Shapes are drawn into
// canvas icons on demand (no sprite sheet); MARKER_SCALE enlarges them for screen viewing like the text sizes here.
const MARKERS = {
  hut:            { shape: "house",    size: 9,   color: "#6b3a1a", minzoom: 12, rank: 1 },
  trailhead:      { shape: "square",   size: 7.5, color: "#b0281c", minzoom: 13, rank: 2 },
  campsite:       { shape: "triangle", size: 8,   color: "#2e7d32", minzoom: 13, rank: 3 },
  shelter:        { shape: "house",    size: 7.5, color: "#a0703c", minzoom: 13, rank: 4 },
  waterfall:      { shape: "diamond",  size: 7,   color: "#1f78c8", minzoom: 13, rank: 5 },
  viewpoint:      { shape: "star",     size: 8,   color: "#c25e00", minzoom: 14, rank: 6 },
  spring:         { shape: "circle",   size: 5.5, color: "#1f78c8", minzoom: 14, rank: 7 },
  drinking_water: { shape: "circle",   size: 5.5, color: "#1f78c8", minzoom: 14, rank: 7 },
  cave:           { shape: "circle",   size: 5.5, color: "#222222", minzoom: 14, rank: 8 },
  parking:        { shape: "square",   size: 8,   color: "#2b5fa8", minzoom: 14, rank: 9, text: "P" },
};
const MARKER_EXCLUDED_SUBCLASSES = ["camp_pitch", "picnic_shelter", "gazebo", "street_side"];
const MARKER_SCALE = 1.4, MARKER_RATIO = 2, MARKER_HALO = "#f6f1e4";
// Outline of a marker of radius r centred at (cx, cy): the same vertices as OsmLayer.markerShape in devtool.
function markerPath(g, shape, cx, cy, r) {
  g.beginPath();
  const poly = pts => { pts.forEach(([x, y], i) => i ? g.lineTo(cx + x * r, cy + y * r) : g.moveTo(cx + x * r, cy + y * r)); g.closePath(); };
  if (shape === "circle") g.arc(cx, cy, r, 0, 2 * Math.PI);
  else if (shape === "square") g.rect(cx - r * 0.9, cy - r * 0.9, 1.8 * r, 1.8 * r);
  else if (shape === "triangle") poly([[0, -1.1], [1, 0.8], [-1, 0.8]]);
  else if (shape === "diamond") poly([[0, -1.15], [0.9, 0], [0, 1.15], [-0.9, 0]]);
  else if (shape === "house") poly([[0, -1.1], [1, -0.1], [0.75, -0.1], [0.75, 0.9], [-0.75, 0.9], [-0.75, -0.1], [-1, -0.1]]);
  else if (shape === "star") poly(Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.5 : 1.2; return [rr * Math.cos(a), rr * Math.sin(a)]; }));
}
function markerImage(m) {
  const px = m.size * MARKER_SCALE * MARKER_RATIO, r = px / 2, halo = 2.5 * MARKER_RATIO;
  const side = Math.ceil(px * 1.3 + 2 * halo), c = side / 2;
  const canvas = new OffscreenCanvas(side, side), g = canvas.getContext("2d");
  markerPath(g, m.shape, c, c, r);
  g.lineJoin = "round"; g.lineWidth = halo; g.strokeStyle = MARKER_HALO; g.stroke();
  g.fillStyle = m.color; g.fill();
  if (m.text) {
    g.fillStyle = "#ffffff"; g.font = `bold ${Math.round(px * 0.8)}px system-ui, sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(m.text, c, c + px * 0.04);
  }
  return { width: side, height: side, data: new Uint8Array(g.getImageData(0, 0, side, side).data.buffer) };
}
const markerClasses = Object.keys(MARKERS);
const byClass = key => ["match", ["get", "class"], ...markerClasses.flatMap(k => [k, MARKERS[k][key]]), 99];
// Features that get a marker: a class in the table, at or past its first zoom, not an excluded subclass.
const markerFilter = ["all", ["in", ["get", "class"], ["literal", markerClasses]], [">=", ["zoom"], byClass("minzoom")],
  ["!", ["in", ["coalesce", ["get", "subclass"], ""], ["literal", MARKER_EXCLUDED_SUBCLASSES]]]];

const contourTiles = demSource.contourProtocolUrl({
  multiplier: 3.28084,
  thresholds: { 8: [1000, 5000], 10: [500, 2500], 11: [200, 1000], 12: [100, 500], 13: [80, 400], 14: [40, 200], 15: [20, 100] },
  elevationKey: "ele",
  levelKey: "level",
  contourLayer: "contours",
});

const map = new maplibregl.Map({
  container: "map",
  center: [-121.76, 46.86],
  zoom: 11,
  minZoom: 7,
  maxZoom: 17,
  hash: true,
  style: {
    version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      // bounds = the generated region (Rainier NP and surroundings). In pmtiles mode MapLibre reads bounds and
      // zooms from the archive header via pmtiles.js.
      // Hillshade reads the same tiles as the contours, through the ancestor fallback (sharedDemProtocolUrl), in both modes.
      dem: { type: "raster-dem", tiles: [demSource.sharedDemProtocolUrl], tileSize: 256, encoding: "terrarium", minzoom: 8, maxzoom: 14 }, // no bounds: tiles past the pack come from the ancestor fallback, as for contours
      contours: { type: "vector", tiles: [contourTiles], minzoom: 8, maxzoom: 15, bounds: [-122.05, 46.60, -121.40, 47.10] },
      osm: { type: "vector", url: "pmtiles://" + osmArchiveUrl },
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#f6f1e4" } },
      { id: "hillshade", type: "hillshade", source: "dem",
        paint: { "hillshade-exaggeration": 0.55, "hillshade-shadow-color": "#4a3f36", "hillshade-highlight-color": "#fffdf7", "hillshade-accent-color": "#6b5a4d" } },
      { id: "glacier", type: "fill", source: "osm", "source-layer": "landcover", filter: ["==", ["get", "subclass"], "glacier"],
        paint: { "fill-color": "#eaf3ff", "fill-opacity": 0.55 } },
      { id: "wood", type: "fill", source: "osm", "source-layer": "landcover", filter: ["==", ["get", "class"], "wood"],
        paint: { "fill-color": "#cfe0bf", "fill-opacity": 0.35 } },
      { id: "park", type: "line", source: "osm", "source-layer": "park", filter: ["!=", ["get", "class"], "wilderness"],
        paint: { "line-color": "#4b8a3a", "line-width": 1.5, "line-dasharray": [4, 2] } },
      // Wilderness (outdoors archive class wilderness: protect_class 1b or a wilderness designation) is a distinct, darker green dash-dot.
      { id: "wilderness", type: "line", source: "osm", "source-layer": "park", filter: ["==", ["get", "class"], "wilderness"],
        paint: { "line-color": "#2d5e2a", "line-width": 2, "line-dasharray": [6, 2, 1, 2] } },
      { id: "waterway", type: "line", source: "osm", "source-layer": "waterway", paint: { "line-color": "#5b9bd5", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.6, 15, 2] } },
      // Water above waterways: the archive draws streams through lakes (river centrelines), which would show as spokes.
      { id: "water", type: "fill", source: "osm", "source-layer": "water", paint: { "fill-color": "#9ec5e8" } },
      { id: "contour-minor", type: "line", source: "contours", "source-layer": "contours", filter: ["!=", ["get", "level"], 1],
        paint: { "line-color": "#8c5523", "line-opacity": 0.6, "line-width": 0.7 } },
      { id: "contour-index", type: "line", source: "contours", "source-layer": "contours", filter: ["==", ["get", "level"], 1],
        paint: { "line-color": "#8c5523", "line-opacity": 0.85, "line-width": 1.6 } },
      { id: "roads", type: "line", source: "osm", "source-layer": "transportation",
        filter: ["all", ["!=", ["get", "class"], "path"], ["!=", ["get", "class"], "track"]],
        paint: { "line-color": "#555", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.8, 15, 3] } },
      { id: "tracks", type: "line", source: "osm", "source-layer": "transportation", filter: ["==", ["get", "class"], "track"],
        paint: { "line-color": "#7a5230", "line-width": 1.4, "line-dasharray": [3, 1.5] } },
      // Trails by sac_scale (outdoors archive): plain hiking = red dash; mountain_hiking = darker, longer dash;
      // demanding_mountain_hiking and harder (alpine) = purple, tight dots. Low trail_visibility fades the line,
      // informal trails are thinner. The OpenMapTiles archive has none of these attributes and draws all trails as "hiking".
      { id: "trails", type: "line", source: "osm", "source-layer": "transportation",
        filter: ["all", ["==", ["get", "class"], "path"], ["!", ["in", ["coalesce", ["get", "sac_scale"], ""], ["literal", ["mountain_hiking", "demanding_mountain_hiking", "alpine_hiking", "demanding_alpine_hiking", "difficult_alpine_hiking"]]]]],
        paint: { "line-color": "#c0392b", "line-opacity": ["match", ["get", "trail_visibility"], ["bad", "horrible", "no"], 0.4, "intermediate", 0.7, 1], "line-dasharray": [2, 1.2],
                 "line-width": ["interpolate", ["linear"], ["zoom"], 10, ["*", 1, ["case", ["==", ["get", "informal"], 1], 0.6, 1]], 15, ["*", 2.5, ["case", ["==", ["get", "informal"], 1], 0.6, 1]]] } },
      { id: "trails-mountain", type: "line", source: "osm", "source-layer": "transportation",
        filter: ["all", ["==", ["get", "class"], "path"], ["==", ["get", "sac_scale"], "mountain_hiking"]],
        paint: { "line-color": "#8e1b12", "line-opacity": ["match", ["get", "trail_visibility"], ["bad", "horrible", "no"], 0.4, "intermediate", 0.7, 1], "line-dasharray": [4, 1.2],
                 "line-width": ["interpolate", ["linear"], ["zoom"], 10, ["*", 1.3, ["case", ["==", ["get", "informal"], 1], 0.6, 1]], 15, ["*", 3, ["case", ["==", ["get", "informal"], 1], 0.6, 1]]] } },
      { id: "trails-alpine", type: "line", source: "osm", "source-layer": "transportation",
        filter: ["all", ["==", ["get", "class"], "path"], ["in", ["coalesce", ["get", "sac_scale"], ""], ["literal", ["demanding_mountain_hiking", "alpine_hiking", "demanding_alpine_hiking", "difficult_alpine_hiking"]]]],
        paint: { "line-color": "#6a1b9a", "line-opacity": ["match", ["get", "trail_visibility"], ["bad", "horrible", "no"], 0.4, "intermediate", 0.7, 1], "line-dasharray": [1, 1.4],
                 "line-width": ["interpolate", ["linear"], ["zoom"], 10, ["*", 1.5, ["case", ["==", ["get", "informal"], 1], 0.6, 1]], 15, ["*", 3.5, ["case", ["==", ["get", "informal"], 1], 0.6, 1]]] } },
      // Cliffs: a dark line with a wide, tightly dashed copy so short ticks stick out on both sides.
      { id: "cliff-ticks", type: "line", source: "osm", "source-layer": "natural_line", minzoom: 12, filter: ["==", ["get", "class"], "cliff"],
        paint: { "line-color": "#3a2f28", "line-width": ["interpolate", ["linear"], ["zoom"], 12, 4, 16, 8], "line-dasharray": [0.18, 1.1] } },
      { id: "cliffs", type: "line", source: "osm", "source-layer": "natural_line", minzoom: 12, filter: ["==", ["get", "class"], "cliff"],
        paint: { "line-color": "#3a2f28", "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1.2, 16, 2.4] } },
      { id: "ridges", type: "line", source: "osm", "source-layer": "natural_line", minzoom: 12, filter: ["in", ["get", "class"], ["literal", ["ridge", "arete"]]],
        paint: { "line-color": "#7b5a3c", "line-opacity": 0.8, "line-width": 1.6, "line-dasharray": [6, 2] } },      { id: "contour-labels", type: "symbol", source: "contours", "source-layer": "contours", filter: ["==", ["get", "level"], 1],
        layout: { "symbol-placement": "line", "text-field": ["concat", ["number-format", ["get", "ele"], {}], ""], "text-font": ["Noto Sans Regular"],
                  "text-size": 13, "symbol-spacing": 220, "text-max-angle": 55, "text-padding": 4 },
        paint: { "text-color": "#6b3f12", "text-halo-color": "#f6f1e4", "text-halo-width": 1.6 } },
      { id: "trail-names", type: "symbol", source: "osm", "source-layer": "transportation_name", minzoom: 12,
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 13, "symbol-spacing": 400 },
        paint: { "text-color": "#7a2e22", "text-halo-color": "#f6f1e4", "text-halo-width": 1.6 } },
      { id: "ridge-names", type: "symbol", source: "osm", "source-layer": "natural_line", minzoom: 12,
        filter: ["all", ["in", ["get", "class"], ["literal", ["ridge", "arete"]]], ["has", "name"]],
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": ["Noto Sans Italic"], "text-size": 13, "symbol-spacing": 500, "text-letter-spacing": 0.15, "text-padding": 6 },
        paint: { "text-color": "#5a3d22", "text-halo-color": "#f6f1e4", "text-halo-width": 1.6 } },
      // Outdoors POIs: the renderer's marker shapes and colours (MARKERS above; icons made in styleimagemissing), with
      // the name under the marker from z13 (parking: marker only). As in the renderer, marker and name are one label
      // whose text is optional, so a name that doesn't fit never costs the marker; higher-ranked classes place first
      // and markers collide with each other, so dense parking lots thin out.
      { id: "poi-markers", type: "symbol", source: "osm", "source-layer": "outdoor_poi", minzoom: 12, filter: markerFilter,
        layout: { "icon-image": ["concat", "poi-", ["get", "class"]], "icon-padding": 1, "symbol-sort-key": byClass("rank"),
                  "text-field": ["step", ["zoom"], "", 13, ["case", ["==", ["get", "class"], "parking"], "", ["coalesce", ["get", "name"], ""]]],
                  "text-font": ["Noto Sans Regular"], "text-size": 12, "text-anchor": "top", "text-offset": [0, 0.9], "text-max-width": 8,
                  "text-padding": 6, "text-optional": true },
        paint: { "text-color": "#3b2a1a", "text-halo-color": "#f6f1e4", "text-halo-width": 1.6 } },      { id: "water-names", type: "symbol", source: "osm", "source-layer": "water_name",
        layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 13 },
        paint: { "text-color": "#2f6ea6", "text-halo-color": "#f6f1e4", "text-halo-width": 1.6 } },
      { id: "peaks", type: "symbol", source: "osm", "source-layer": "mountain_peak", filter: ["!", ["in", ["get", "class"], ["literal", ["ridge", "arete", "cliff"]]]],
        layout: { "text-field": ["case", ["has", "ele"], ["concat", ["get", "name"], "\n", ["get", "ele"], " m"], ["get", "name"]], "text-font": ["Noto Sans Regular"], "text-size": 14,
                  "text-anchor": "top", "text-offset": [0, 0.4], "icon-image": "" },
        paint: { "text-color": "#3b2a1a", "text-halo-color": "#f6f1e4", "text-halo-width": 1.8 } },
      { id: "places", type: "symbol", source: "osm", "source-layer": "place",
        layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 16 },
        paint: { "text-color": "#222", "text-halo-color": "#f6f1e4", "text-halo-width": 2 } },
    ],
  },
});
window.map = map; // for tools/demo-check.py
map.on("styleimagemissing", e => {
  const m = e.id.startsWith("poi-") && MARKERS[e.id.slice(4)];
  if (m && !map.hasImage(e.id)) map.addImage(e.id, markerImage(m), { pixelRatio: MARKER_RATIO });
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }));

const textLayers = ["contour-labels", "trail-names", "ridge-names", "poi-markers", "water-names", "peaks", "places"];
const baseSizes = { "contour-labels": 13, "trail-names": 13, "ridge-names": 13, "poi-markers": 12, "water-names": 13, "peaks": 14, "places": 16 };
function applyTextScale(k) { for (const id of textLayers) map.setLayoutProperty(id, "text-size", Math.round(baseSizes[id] * k)); }
function toggle(ids, on) { for (const id of ids) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); }
map.on("load", () => {
  applyTextScale(parseFloat(document.getElementById("text").value));
  document.getElementById("text").oninput = e => applyTextScale(parseFloat(e.target.value));
  const sel = document.getElementById("osmsel"); sel.value = osmMode;
  sel.onchange = () => { const u = new URL(location.href); u.searchParams.set("osm", sel.value); location.href = u.href; };
  document.getElementById("hill").onchange = e => toggle(["hillshade"], e.target.checked);
  document.getElementById("contours").onchange = e => toggle(["contour-minor", "contour-index", "contour-labels"], e.target.checked);
  document.getElementById("osm").onchange = e => toggle(["glacier", "wood", "park", "wilderness", "water", "waterway", "roads", "tracks", "trails", "trails-mountain", "trails-alpine", "cliff-ticks", "cliffs", "ridges", "ridge-names", "poi-markers", "trail-names", "water-names", "peaks", "places"], e.target.checked);
});
const status = document.getElementById("status");
map.on("move", () => { const c = map.getCenter(); status.textContent = `z ${map.getZoom().toFixed(1)}  ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`; });
map.on("error", e => { if (e.error && !/404|Not Found/.test(e.error.message || "")) console.warn(e.error); });
</script>
</body>
</html>
